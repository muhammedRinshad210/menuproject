{% extends "menuapp/base.html" %}
{% block content %}

<div class="container mt-5">
    <h2>Help & Support</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" class="form-control mb-2" placeholder="Your Name" required>
        <input type="email" name="email" class="form-control mb-2" placeholder="Your Email" required>
        <textarea name="message" class="form-control mb-3" placeholder="Your Problem" required></textarea>
        <button class="btn btn-dark w-100">Send Help Request</button>
    </form>
</div>

{% endblock %}
