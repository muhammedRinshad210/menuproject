{% extends "menuapp/base.html" %}

{% block content %}

<div class="container mt-5">

<h2>Order Bill</h2>

<table class="table">

<tr>
<th>Item</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
</tr>

{% for item in order.items.all %}
<tr>
<td>{{ item.product_name }}</td>
<td>₹{{ item.price }}</td>
<td>{{ item.quantity }}</td>
<td>₹{{ item.subtotal }}</td>
</tr>
{% endfor %}

</table>

<h4>Total: ₹{{ order.total_amount }}</h4>

<button onclick="window.print()" class="btn btn-dark">
Print Bill
</button>

</div>

{% endblock %}
